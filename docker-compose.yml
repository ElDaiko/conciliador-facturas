# Opcional: levanta la solución completa con un solo comando.
#   docker compose up --build   →   http://localhost:8080
services:
  backend:
    build: ./backend
    # Sin "ports": la API solo es accesible desde el frontend, dentro de la red de Docker.
    expose:
      - '8000'

  frontend:
    build: ./frontend
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy # espera a que /api/health responda
