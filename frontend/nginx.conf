# Cumple en Docker el papel que proxy.conf.json cumple en desarrollo:
# el navegador ve un solo origen (sin CORS) y nginx reenvía /api al backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dos archivos de hasta 5 MB cada uno, más el sobrecosto del formulario.
    client_max_body_size 11m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        # "backend" es el nombre del servicio en docker-compose.yml.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Aplicación de una sola página: cualquier ruta desconocida carga index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
